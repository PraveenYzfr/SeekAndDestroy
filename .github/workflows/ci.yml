# Fast gate. Runs on every push and pull request.
#
# WHAT THIS DELIBERATELY DOES NOT DO: run the Python test suite.
#
# tests/conftest.py says it plainly - the suite runs against a live seeded SQL
# Server, and that is a design choice rather than a mocking gap: the seed data
# IS the fixture set, engineered in scripts/generate_seed.py so every rule,
# scoring and right-sizing behaviour has a known-answer example to assert
# against. 42 of the 100 test files need it, 4 need Qdrant and 1 needs Redis,
# and database/seed.sql is 78 MB generated by a 1,319-line script.
#
# Standing all that up takes minutes, so it lives in full-suite.yml. Putting it
# here would make every push wait on it, and a slow required gate is one people
# learn to merge around.
#
# What is left is still worth having, and all of it was measured to pass before
# this file was written:
#
#   ruff          89 issues found on the first run, 88 auto-fixable, all fixed
#   import-linter 2 contracts, both passing - one of them only after a real
#                 architectural fix the linter itself found
#   collection    1,498 tests import cleanly with NO DATABASE AT ALL (proved by
#                 running it against SAD_DB__SERVER=no-such-server). That makes
#                 it a genuine smoke test: it catches a syntax error, a broken
#                 import and a circular import in seconds, which is most of what
#                 actually breaks a branch.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push supersedes an older one on the same ref. Nobody reads the
  # result of a run for a commit that has already been replaced.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python - lint, layering, import smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-dev.txt

      - name: Install
        # Runtime requirements too: import-linter and pytest --collect-only both
        # IMPORT the application, so a missing dependency has to fail here
        # rather than as a confusing contract error.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: Import contracts
        # The deterministic core - scoring, rules, models - must not depend on
        # anything above it. That is the trust boundary in executable form: the
        # claim that a recommendation can be believed rests on nothing else
        # being able to reach in and change a number.
        run: lint-imports --config pyproject.toml

      - name: Test collection (no database required)
        # Deliberately points at a server that does not exist, so this can never
        # silently start depending on one. If someone adds a module-level query
        # to a test file, this step fails and says so.
        env:
          SAD_DB__SERVER: no-such-server-ci-probe
          SAD_DB__DATABASE: none
        run: pytest --collect-only -q

  gateway:
    name: .NET gateway - build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --verbosity minimal

  ui:
    name: UI - typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      # `npm run build` is `tsc && vite build`, so this IS the type check.
      # There is no test script in package.json; adding one is separate work.
      - run: npm run build
