# The full Python suite, against a real SQL Server.
#
# NOT VERIFIED YET, AND DELIBERATELY NOT A REQUIRED CHECK.
#
# Everything in ci.yml was run locally before being written down. This file
# cannot be - it stands up service containers and loads a 78 MB seed, and the
# only honest way to learn how long that takes is to run it. So it is
# schedule-and-manual only, it blocks nothing, and it should stay that way until
# somebody has watched it pass twice and knows the wall-clock number.
#
# Shipping it green-by-assumption would be the exact failure this repository
# keeps writing down: a check that reports success without having measured
# anything.
#
# WHAT IT HAS TO STAND UP
#   SQL Server 2022         42 of 100 test files
#   schema.sql              640 lines
#   27 migrations           idempotent, applied in glob order
#   database/seed.sql       78 MB, gitignored, generated by a 1,319-line script
#
# QDRANT AND REDIS ARE NOT STOOD UP, and that is a correction rather than an
# omission. I wrote both containers in first, then checked: SAD_RETRIEVAL__
# BACKEND and SAD_CACHE__BACKEND both default to "memory", so the four files
# that mention Qdrant and the one that mentions Redis exercise the in-process
# implementations unless a .env opts in. The local machine does opt in, which is
# why a Qdrant warning appears there and not here. The env names I had reached
# for - SAD_QDRANT__URL, SAD_REDIS__URL - do not exist at all.
#
# If the first run proves a container is needed, add it then. Adding one now is
# scaffolding for a need nobody has measured.
#
# THE SEED IS THE EXPENSIVE PART AND THE REASON THIS IS CACHED.
# scripts/generate_seed.py is byte-for-byte reproducible, so the output is a
# pure function of the script. Keying the cache on its hash means the 78 MB is
# regenerated only when the generator itself changes, which is rarely.

name: Full suite

on:
  schedule:
    # 02:00 UTC. Deliberately not "nightly" in local terms - this repository has
    # already shipped a migration dated from the local clock that opened its
    # window three hours in the future.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    name: Full suite against real services
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_MSSQL_SA_PASSWORD }}
        ports: ["1433:1433"]
        options: >-
          --health-cmd "exit 0"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10


    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install sqlcmd
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
          curl -sSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq mssql-tools18
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Wait for SQL Server
        # The container reports healthy before the engine accepts logins, so
        # this asks the engine rather than the container - an exit code from
        # Docker is not evidence that a database is ready.
        run: |
          for i in $(seq 1 60); do
            if sqlcmd -S localhost -U sa -P "$SA" -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "ready after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "SQL Server never accepted a login"; exit 1
        env:
          SA: ${{ secrets.CI_MSSQL_SA_PASSWORD }}

      - name: Cache the generated seed
        id: seed-cache
        uses: actions/cache@v4
        with:
          path: database/seed.sql
          # Byte-for-byte reproducible from the generator, so the generator's
          # hash is a complete cache key. Nothing else can change the output.
          key: seed-${{ hashFiles('scripts/generate_seed.py') }}

      - name: Generate the seed
        if: steps.seed-cache.outputs.cache-hit != 'true'
        run: python scripts/generate_seed.py

      - name: Create the database
        run: sqlcmd -S localhost -U sa -P "$SA" -C -Q "CREATE DATABASE PraveenDB"
        env:
          SA: ${{ secrets.CI_MSSQL_SA_PASSWORD }}

      - name: Apply schema, seed and migrations
        # Migrations in glob order - they are numbered for exactly this reason -
        # and every one is guarded, so applying all of them to a fresh database
        # is safe. -b so a failure stops the step instead of being carried past.
        run: |
          set -e
          sqlcmd -S localhost -U sa -P "$SA" -C -b -d PraveenDB -i database/schema.sql
          time sqlcmd -S localhost -U sa -P "$SA" -C -b -d PraveenDB -i database/seed.sql
          for f in database/migration_*.sql; do
            echo "-- $f"
            sqlcmd -S localhost -U sa -P "$SA" -C -b -d PraveenDB -i "$f"
          done
        env:
          SA: ${{ secrets.CI_MSSQL_SA_PASSWORD }}

      - name: Full suite
        working-directory: ai-service
        env:
          SAD_DB__SERVER: localhost
          SAD_DB__DATABASE: PraveenDB
          SAD_DB__USERNAME: sa
          SAD_DB__PASSWORD: ${{ secrets.CI_MSSQL_SA_PASSWORD }}
          # Backends left at their defaults ("memory") deliberately - see the
          # header. Naming SAD_QDRANT__URL / SAD_REDIS__URL here would have been
          # worse than useless: neither prefix exists. The real ones are
          # SAD_RETRIEVAL__BACKEND and SAD_CACHE__REDIS_URL.
          #
          # No provider keys. "mock" is already the default provider; it is set
          # explicitly so a .env or a future default change cannot quietly point
          # CI at a billable account.
          SAD_LLM__PROVIDER: mock
        run: pytest -q -p no:randomly
