global:
  scrape_interval: 15s

# Conditions worth a human's attention, kept beside the scrape config rather than
# only in Grafana. A Grafana-only alert lives in Grafana's own database, which is
# not in this repository and is not restored by a redeploy - so it survives right
# up until the day the container is recreated.
rule_files:
  - /etc/prometheus/alerts.yml

# WHERE A FIRING ALERT GOES. Without this block Prometheus evaluates every rule
# correctly and notifies nobody - the result lives in its own memory and is
# visible only on a page you had to already be looking at. Seven rules were
# defined and all seven fired into that.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-service:8088"]

  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:5090"]

  # Host metrics: CPU, RAM, disk, IOPS. node-exporter runs in the hub compose
  # (~/infra/docker-compose.yml) because it describes the whole machine, not just
  # this system. Without it Grafana can say nothing about the box underneath.
  - job_name: node
    static_configs:
      - targets: ["hub-node-exporter:9100"]

  # PROMETHEUS SCRAPING ITSELF. Without this it can evaluate every rule in the
  # file and say nothing about its own health: up{job="prometheus"} returned an
  # empty vector, so "is the thing that watches everything still watching"
  # was unanswerable from the thing itself.
  #
  # It also gives the only view of rule-evaluation failures and scrape duration,
  # which is how a silently-degrading Prometheus is normally caught.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # PER-CONTAINER CPU, MEMORY AND LIMITS. node-exporter describes the machine;
  # on a single VM running fifteen containers, "the box is at 5.6%" is not the
  # question anyone asks - "which container" is, and nothing could answer it.
  # container_cpu_usage_seconds_total returned an empty vector before this.
  #
  # cAdvisor is read-only against the Docker socket and the host cgroup tree. It
  # is mounted that way below and is not exposed off the loopback interface.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
