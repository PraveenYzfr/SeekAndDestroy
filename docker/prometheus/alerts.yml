#  Alerts on AI behaviour.
#
#  A dashboard nobody is watching at 2am is a wall of graphs. These are the four
#  conditions worth waking up for, and each one is written to fire on a CHANGE
#  rather than on a level - "hallucination rate is 3%" is not actionable without
#  knowing whether it was 3% yesterday.
#
#  DELIBERATELY NOT ALERTED
#  ------------------------
#  * A single drifted narration. The guard already refused it and the user got a
#    correct answer instead. That is the system working, and paging on it trains
#    people to ignore the page.
#  * Absolute spend. A budget ceiling is enforced in code (spend_denials_total);
#    an alert on top of it would fire second, after the thing that already
#    handled it.
#  * A low judge score on one answer. It is one model's opinion of another's
#    work. The review queue at /api/admin/answer-evaluations?worst_only=true is
#    where those belong - a queue, not a page.

groups:
  - name: ai-quality
    interval: 1m
    rules:
      # The signal that a model change made things worse. Drift means a model
      # stated a figure it was never given and the platform refused the answer;
      # a sustained climb means the current model invents more than the last one.
      - alert: HallucinationRateElevated
        expr: |
          sum(rate(sad_narration_drift_total{outcome="drift"}[30m]))
            / clamp_min(sum(rate(sad_narration_drift_total[30m])), 0.0001) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Over 5% of narrations are being refused for stating ungrounded figures"
          description: >
            The guard is working - these answers were refused, not shown - but a
            rate this high usually follows a model change. Compare against the
            change history on the Model Settings screen before assuming the
            evidence is at fault.

      # The instrument, not the output. A judge that has silently stopped leaves
      # every quality panel showing its last good score forever, which reads as
      # health. This is the alert that says the measurement is broken.
      # A COUNT, NOT A RATE, and the difference decides whether this can fire.
      #
      # 0.05/sec sustained for ten minutes is three judge failures a minute for
      # ten minutes. This estate does not run investigations at anything like
      # that rate, so a judge that had failed on EVERY answer all evening would
      # never have reached the threshold. The rule described a real condition
      # and could not observe it.
      #
      # "The judge failed repeatedly within an hour" is the actual condition,
      # and it does not depend on how busy the platform happens to be.
      #
      # No `or vector(0)` here, deliberately, unlike JudgeNotIndependent below:
      # an absent series means no failure has ever been recorded, and comparing
      # nothing against > 3 correctly yields no alert. There the absent series
      # is on the far side of an `and` and silences a condition that IS true.
      - alert: JudgeNotProducingVerdicts
        expr: sum(increase(sad_judge_failures_total[1h])) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The answer judge is failing to produce verdicts"
          description: >
            Quality panels will keep rendering from older data and will look
            healthy. THE reason LABEL SAYS WHICH DEFECT THIS IS, and they are
            not close to each other:
              exception             the judge call threw - provider, credential
                                    or timeout. Check the judge role's provider
                                    on the Model Settings screen.
              no_verdict            the judge answered and produced nothing
                                    parseable. A schema or parse problem, not
                                    an outage.
              evidence_read_failed  the database could not be read. An
                                    infrastructure fault; the judge is fine.
              no_evidence_gathered  THE PIPELINE DELIVERED AN ANSWER IT NEVER
                                    GATHERED EVIDENCE FOR - no audit row at
                                    all. Not a judge problem: a report was
                                    written about a selection that was never
                                    made. Fix the graph. NOT YET OBSERVED in
                                    production.
              evidence_truncated    the audit writer CUT the prompt itself -
                                    _audit_payload caps a record at 64 KB and
                                    flags what it cuts. Expected on large
                                    reports rather than broken, and the fix is
                                    the cap or storing evidence beside the
                                    prompt, not the judge. Watch it: the final
                                    report carries the most evidence of any
                                    call, so the answer a user actually reads
                                    is the one this most often silences.
              evidence_unparseable  a row exists, is not flagged truncated, and
                                    still carries nothing readable as evidence.
                                    A genuine contract break. Seen on
                                    investigation 124, a right-sizing question
                                    whose only call was the final report.

      # Fidelity is a rate over figures, so a p10 below 0.9 means one answer in
      # ten carried a figure its evidence did not support. Alerting on the tail
      # rather than the mean is the whole point: a mean of 0.97 can be 97 clean
      # answers and 3 broken ones.
      - alert: FidelityTailDegraded
        expr: |
          histogram_quantile(0.1, sum by (le, grader) (rate(sad_fidelity_score_bucket[1h]))) < 0.9
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Bottom-decile answer fidelity has fallen below 0.9 ({{ $labels.grader }})"
          description: >
            One answer in ten is carrying figures its evidence does not support.
            The individual answers are at
            /api/admin/answer-evaluations?worst_only=true - Prometheus has the
            rate, that endpoint has the answers behind it.

      # Not a budget alert. This fires when cost per unit of work MOVES, which is
      # what a role being pointed at a more expensive model looks like from
      # outside - and is invisible in total spend if volume dropped at the same
      # time.
      - alert: CostPerInvestigationJumped
        expr: |
          (
            sum(increase(sad_llm_cost_usd_total[1h]))
              / clamp_min(sum(increase(sad_investigations_total[1h])), 1)
          )
          >
          2 * (
            sum(increase(sad_llm_cost_usd_total[24h] offset 1h))
              / clamp_min(sum(increase(sad_investigations_total[24h] offset 1h)), 1)
          )
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Cost per investigation has doubled against its 24h baseline"
          description: >
            Usually a role moved onto a larger model, or fallbacks are firing and
            a more expensive backup is answering. Check
            sad_llm_fallback_total before assuming it was a configuration change.

      # An empty quality panel is not obviously a problem, which is the problem.
      # This fires when the judge is running fine and none of its verdicts count,
      # which is what a default configuration does: every role on the same model,
      # so the judge grades its own output and every verdict is disqualified.
      - alert: JudgeNotIndependent
        # THIS COULD NOT FIRE IN THE STATE IT DESCRIBES.
        #
        # sad_judge_score_count does not exist until the judge has produced its
        # first INDEPENDENT verdict. When every verdict is self-judged - the
        # exact condition here - that never happens, so the right-hand side
        # returned an EMPTY VECTOR rather than 0, the `and` matched nothing, and
        # the rule stayed silent precisely when it was true.
        #
        # Worse than a missing rule, because its silence gets read as evidence
        # that the judge is independent.
        #
        # `or vector(0)` makes an absent series the zero it means. Same defect,
        # same fix, as the quality panels that read "No data" on a healthy
        # system.
        expr: |
          sum(rate(sad_judge_excluded_total{reason="self_judged"}[30m])) > 0
          and (sum(rate(sad_judge_score_count[30m])) or vector(0)) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Every judge verdict is being disqualified as self-judged"
          description: >
            The judge is grading answers written by its own model, so nothing
            reaches the quality panels and they read as empty rather than as
            unmeasured. Point the judge role at a different provider on the Model
            Settings screen.

      # The instrument failing to record, as opposed to the platform failing.
      # Fires on ANY sustained rate because there is no acceptable level: a
      # verdict that cannot be stored is a verdict that did not happen, and the
      # dashboards above go quietly stale while every panel keeps rendering.
      - alert: EvaluationVerdictsNotBeingStored
        expr: sum(rate(sad_evaluation_persist_failures_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Evaluation verdicts are being computed and not stored ({{ $labels.table }})"
          description: >
            The write is best-effort by design so grading cannot break a
            delivered answer, which means nothing else will report this. First
            thing to check is the INSERT grant - the schema-wide grant covers
            SELECT only, so a newly migrated table is readable and not writable
            until db-init.sh grants it explicitly.

  - name: ai-availability
    interval: 1m
    rules:
      # Fallbacks working is not an incident. Fallbacks working CONSTANTLY means
      # the platform is answering from a model nobody selected, indefinitely,
      # and the screen still shows the primary.
      - alert: SustainedProviderFallback
        expr: sum(rate(sad_llm_fallback_total[15m])) > 0.1
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: "A primary model provider has been failing over for 20 minutes"
          description: >
            Answers are still being produced, by the backup model rather than the
            configured one. The audit log records which actually answered.
