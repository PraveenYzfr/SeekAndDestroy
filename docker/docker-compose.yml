# SeekAndDestroy - Docker Compose (optional; the platform runs fine without
# Docker - see docs/setup.md). SQL Server is NOT containerized here: it's the
# existing external instance from the specification's connection string.
# Containers reach it via `host.docker.internal` on Windows/Mac Docker
# Desktop; on Linux Docker set `SAD_DB__SERVER` to the host's LAN address.
#
# Every service is behind a profile - a bare `docker compose up` starts
# NOTHING, on purpose. 7 containers (2 of them JVM/Node-adjacent - Grafana,
# Prometheus - plus a vector DB) is real memory you don't want idling when
# you're not actually using it. Pick what you need, from the repo root:
#
#   docker compose -f docker/docker-compose.yml --profile core up --build
#     -> qdrant, redis, ai-service, api-gateway, ui (the actual app)
#
#   docker compose -f docker/docker-compose.yml --profile observability up
#     -> + prometheus, grafana (only when you're actively watching metrics)
#
#   docker compose -f docker/docker-compose.yml --profile core --profile observability up
#     -> everything
#
# Stop everything and free the memory back up when you're done - use the SAME
# --profile flag(s) you started with, or compose won't know which containers
# it's supposed to be stopping and silently does nothing:
#   docker compose -f docker/docker-compose.yml --profile core --profile observability down

services:
  # SQL Server as a container rather than a host install. Two things this buys
  # beyond convenience: the image is SQL-authentication only, so the "enable
  # Mixed Mode and restart the service" step disappears entirely (a container
  # has no Windows identity to use anyway); and the whole estate rebuilds from
  # a deterministic 6.6 MB seed, so there is nothing precious on this volume -
  # losing it costs about two minutes.
  #
  # Set SAD_DB_HOST=host.docker.internal in docker/.env to point at an external
  # SQL Server instead and this service simply goes unused.
  sqlserver:
    profiles: ["core"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SAD_SA_PASSWORD:?set SAD_SA_PASSWORD in docker/.env - 8+ chars, mixed case, digit and symbol, or SQL Server exits on startup}"
      # Express, not Developer - a shared decision across the three co-hosted
      # systems (see _multi-system-hub/SHARED_PLAN.md 2). One instance carries
      # one edition, so the choice has to hold for whatever the strictest
      # workload turns out to be, and Express is the only free edition that is
      # also production-licensed. Cost: a 10 GB cap per database (per database,
      # not per instance) and a ~1.4 GB buffer pool - neither binds here.
      MSSQL_PID: "Express"
      # Express caps its own buffer pool, but the container will still grow
      # beyond it. Without this, SQL Server is the process that starves the
      # other services on a shared box.
      MSSQL_MEMORY_LIMIT_MB: "${SAD_SQL_MEMORY_MB:-2048}"
    # 14330, not 1433: a laptop running SQL Server natively already owns 1433,
    # and silently colliding with it is a confusing way to lose an evening.
    # Loopback-bound - reach it on a VM through an SSH tunnel, never an NSG rule.
    ports:
      - "127.0.0.1:${SAD_SA_HOST_PORT:-14330}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      # -C trusts the self-signed cert the container generates; -b makes a
      # failed query a non-zero exit so the healthcheck actually fails.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot: creates PraveenDB, applies schema + migrations + seed, then exits.
  # Guarded so a restart never re-seeds - schema.sql creates tables
  # unconditionally and seed.sql would duplicate all 96k rows.
  db-init:
    profiles: ["core"]
    # The server image, not a separate tools image: it already ships sqlcmd at
    # /opt/mssql-tools18/bin (the healthcheck above uses it), so this pulls no
    # extra layers and the tool version cannot drift from the server's.
    # mcr.microsoft.com/mssql-tools18:latest does not exist - only the
    # unversioned mssql-tools image does, and that one is still tools17.
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SA_PASSWORD: "${SAD_SA_PASSWORD}"
      DB_NAME: "${SAD_DB_NAME:-PraveenDB}"
      APP_LOGIN: "${SAD_DB_USERNAME:-sad_app}"
      APP_PASSWORD: "${SAD_DB_PASSWORD:?set SAD_DB_PASSWORD in docker/.env}"
    volumes:
      - ../database:/database:ro
      - ./db-init.sh:/db-init.sh:ro
    entrypoint: ["/bin/bash", "/db-init.sh"]
    restart: "no"

  qdrant:
    profiles: ["core"]
    image: qdrant/qdrant:latest
    # Bound to loopback, NOT 0.0.0.0. Qdrant ships with no authentication, so
    # "6333:6333" on a cloud VM is an unauthenticated vector database exposed
    # to the internet the moment the NSG allows it. ai-service reaches it as
    # http://qdrant:6333 over the compose network and needs no host mapping at
    # all; this one exists only for local debugging.
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      # Defence in depth for the case where the port does get exposed. Empty
      # leaves auth off, which is fine for a laptop and not for a VM.
      QDRANT__SERVICE__API_KEY: "${SAD_QDRANT_API_KEY:-}"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The qdrant image ships neither wget nor curl - bash's own /dev/tcp
      # redirection (no external binary needed) is enough to confirm the port
      # is actually accepting connections.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles: ["core"]
    image: redis:7-alpine
    # Loopback only - Redis has no auth here either, and an open 6379 is one
    # of the most reliably exploited ports on the internet.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    profiles: ["core"]
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    # Loopback only: the browser never talks to ai-service directly. The UI's
    # nginx proxies /api/ to api-gateway, which calls ai-service over the
    # compose network. Only the ui service needs a public port.
    ports:
      - "127.0.0.1:8088:8088"
    environment: &ai_environment
      # Defaults to the sqlserver container. Set SAD_DB_HOST=host.docker.internal
      # in docker/.env to use an external instance instead.
      SAD_DB__SERVER: "${SAD_DB_HOST:-sqlserver}"
      # Configurable so the co-hosted VM can use "SeekandDestroy" alongside
      # RLogistics and AutoCoder in one shared SQL Express instance.
      SAD_DB__DATABASE: "${SAD_DB_NAME:-PraveenDB}"
      SAD_DB__INTEGRATED_SECURITY: "false" # container has no Windows identity - see docs/setup.md
      SAD_DB__USERNAME: "${SAD_DB_USERNAME:-sad_app}"
      SAD_DB__PASSWORD: "${SAD_DB_PASSWORD:-}"
      # NO DEFAULT, deliberately. This used to read `"mock"`, which meant a
      # local stack silently narrated from a canned model while looking
      # identical to production - and the VM nearly shipped that way, passing
      # every health check. Three of the bugs found during the first real
      # deployment were unreachable locally purely because local defaults
      # differed from the VM's.
      #
      # Set SAD_LLM_PROVIDER=mock explicitly if you want the mock. An
      # unset value now stops the stack instead of quietly changing what it is.
      SAD_LLM__PROVIDER: "${SAD_LLM_PROVIDER:?set SAD_LLM_PROVIDER in docker/.env - see docker/.env.example}"
      SAD_LLM__MODEL: "${SAD_LLM_MODEL:-}"
      SAD_LLM__API_KEY: "${SAD_LLM_API_KEY:-}"
      SAD_LLM__BASE_URL: "${SAD_LLM_BASE_URL:-}"
      SAD_LLM__PROVIDER_LABEL: "${SAD_LLM_PROVIDER_LABEL:-}"
      SAD_LLM__MAX_OUTPUT_TOKENS: "${SAD_LLM_MAX_OUTPUT_TOKENS:-8192}"
      SAD_LLM__DAILY_CALL_BUDGET: "${SAD_LLM_DAILY_CALL_BUDGET:-50000}"
      SAD_RETRIEVAL__BACKEND: "qdrant"
      SAD_RETRIEVAL__QDRANT_URL: "http://qdrant:6333"
      SAD_RETRIEVAL__QDRANT_API_KEY: "${SAD_QDRANT_API_KEY:-}"
      # Embeddings are unset here on purpose: ai-service/.env is excluded from
      # the image (see .dockerignore), so a real provider's key must be
      # injected at deploy time rather than baked into a layer. Left unset,
      # the service falls back to the offline hash embedder.
      # Defaults match production. hash/384 was the old local default and it
      # hid a real bug: a full reindex at 3072 dimensions serialises to 96 MB
      # and exceeds Qdrant's 32 MiB request cap, which 384-dimension vectors
      # never approach. That failure was structurally unreachable locally.
      SAD_RETRIEVAL__EMBEDDING_PROVIDER: "${SAD_EMBEDDING_PROVIDER:-gemini}"
      SAD_RETRIEVAL__EMBEDDING_MODEL: "${SAD_EMBEDDING_MODEL:-gemini-embedding-001}"
      SAD_RETRIEVAL__EMBEDDING_API_KEY: "${SAD_EMBEDDING_API_KEY:-}"
      SAD_RETRIEVAL__EMBEDDING_DIMENSIONS: "${SAD_EMBEDDING_DIMENSIONS:-3072}"
      SAD_CACHE__BACKEND: "redis"
      SAD_CACHE__REDIS_URL: "redis://redis:6379/0"
      # local mode default - CHANGE SAD_AUTH__LOCAL_SIGNING_KEY (both here and on
      # api-gateway's Auth__LocalSigningKey below - they must match exactly) in any
      # shared/deployed environment. See docs/api-contracts.md § Authentication.
      SAD_AUTH__MODE: "${SAD_AUTH_MODE:-local}"
      SAD_AUTH__LOCAL_SIGNING_KEY: "${SAD_AUTH_LOCAL_SIGNING_KEY:-dev-only-insecure-signing-key-change-me}"
      SAD_AUTH__OIDC_AUTHORITY: "${SAD_AUTH_OIDC_AUTHORITY:-}"
      SAD_AUTH__OIDC_AUDIENCE: "${SAD_AUTH_OIDC_AUDIENCE:-}"
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Waits for db-init to *exit successfully*, not merely to start - so the
      # service never comes up against a half-seeded database.
      db-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------------------
  # ai-indexer - the indexing worker. Same image as ai-service, different command.
  #
  # Separate from ai-service because indexing is long, memory-hungry and bound on
  # an external provider, and none of that belongs in the process serving
  # interactive investigations. A full index used to run inside the HTTP request
  # that triggered it, holding a worker thread for minutes.
  #
  # No ports: it serves nothing. It consumes a Redis list and writes to Qdrant
  # and SQL Server. Progress is visible through ai-service's /api/index/runs,
  # which reads the same sad.IndexRun rows this worker writes.
  #
  # The environment is a YAML anchor from ai-service rather than a copy. These
  # two must agree about the database, the embedder and the vector store: a
  # worker embedding with different settings from the service that queries would
  # write vectors into a collection nothing searches, and nothing would error.
  # ---------------------------------------------------------------------------
  ai-indexer:
    profiles: ["core"]
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    command: ["python", "-m", "app.retrieval.worker"]
    environment: *ai_environment
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Restarts on crash; a deliberate `compose stop` stays stopped. The worker
    # drains on SIGTERM, so a restart costs at most the batch in flight.
    restart: unless-stopped
    # SIGTERM, then 60s to finish the current batch before SIGKILL. The default
    # 10s is not enough for a batch waiting on an embedding provider, and being
    # killed mid-batch means repeating that batch on the next run.
    stop_grace_period: 60s

  api-gateway:
    profiles: ["core"]
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    # Loopback only - reached through the UI's nginx proxy, not directly.
    ports:
      - "127.0.0.1:5090:5090"
    environment:
      ConnectionStrings__PraveenDB: "Data Source=${SAD_DB_HOST:-sqlserver};Initial Catalog=${SAD_DB_NAME:-PraveenDB};Integrated Security=False;User ID=${SAD_DB_USERNAME:-sad_app};Password=${SAD_DB_PASSWORD:-};TrustServerCertificate=True;"
      AiService__BaseUrl: "http://ai-service:8088"
      # Must not be shorter than the ui container's nginx proxy_read_timeout,
      # or the gateway gives up first and the user sees "Internal server
      # error" while the investigation is still running behind it. That is
      # exactly what happened: nginx was raised to 300s when investigations
      # started taking 44-60s, but this stayed at the 60s baked into
      # appsettings.json and was not overridable from here at all.
      AiService__TimeoutSeconds: "${SAD_AI_SERVICE_TIMEOUT_SECONDS:-300}"
      # Must match ai-service's SAD_AUTH__* above exactly - both validate the same tokens.
      Auth__Mode: "${SAD_AUTH_MODE:-local}"
      Auth__LocalSigningKey: "${SAD_AUTH_LOCAL_SIGNING_KEY:-dev-only-insecure-signing-key-change-me}"
      Auth__OidcAuthority: "${SAD_AUTH_OIDC_AUTHORITY:-}"
      Auth__OidcAudience: "${SAD_AUTH_OIDC_AUDIENCE:-}"
    depends_on:
      ai-service:
        condition: service_started
      db-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ui:
    profiles: ["core"]
    build:
      context: ../ui
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api-gateway

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    # Loopback only - Prometheus has no auth and its /api/v1/query endpoint
    # will answer anyone who asks.
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # No depends_on ai-service/api-gateway on purpose - this profile must work
    # standalone (--profile observability without --profile core). Prometheus
    # just retries scraping until a target exists; a target being down shows
    # up as "down" in Prometheus, which is normal, not an error.

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Anonymous viewing is convenient on a laptop and wrong anywhere else -
      # Grafana would expose your infrastructure metrics to whoever finds the
      # port. Set SAD_GRAFANA_ANONYMOUS=false and a real admin password on any
      # deployed environment.
      GF_AUTH_ANONYMOUS_ENABLED: "${SAD_GRAFANA_ANONYMOUS:-true}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: "${SAD_GRAFANA_ADMIN_PASSWORD:-admin}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mssql_data:
  qdrant_storage:
  redis_data:
  prometheus_data:
  grafana_data:
