# SeekAndDestroy - Docker Compose (optional; the platform runs fine without
# Docker - see docs/setup.md). SQL Server is NOT containerized here: it's the
# existing external instance from the specification's connection string.
# Containers reach it via `host.docker.internal` on Windows/Mac Docker
# Desktop; on Linux Docker set `SAD_DB__SERVER` to the host's LAN address.
#
# Every service is behind a profile - a bare `docker compose up` starts
# NOTHING, on purpose. 7 containers (2 of them JVM/Node-adjacent - Grafana,
# Prometheus - plus a vector DB) is real memory you don't want idling when
# you're not actually using it. Pick what you need, from the repo root:
#
#   docker compose -f docker/docker-compose.yml --profile core up --build
#     -> qdrant, redis, ai-service, api-gateway, ui (the actual app)
#
#   docker compose -f docker/docker-compose.yml --profile observability up
#     -> + prometheus, grafana (only when you're actively watching metrics)
#
#   docker compose -f docker/docker-compose.yml --profile core --profile observability up
#     -> everything
#
# Stop everything and free the memory back up when you're done - use the SAME
# --profile flag(s) you started with, or compose won't know which containers
# it's supposed to be stopping and silently does nothing:
#   docker compose -f docker/docker-compose.yml --profile core --profile observability down

services:
  qdrant:
    profiles: ["core"]
    image: qdrant/qdrant:latest
    # Bound to loopback, NOT 0.0.0.0. Qdrant ships with no authentication, so
    # "6333:6333" on a cloud VM is an unauthenticated vector database exposed
    # to the internet the moment the NSG allows it. ai-service reaches it as
    # http://qdrant:6333 over the compose network and needs no host mapping at
    # all; this one exists only for local debugging.
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      # Defence in depth for the case where the port does get exposed. Empty
      # leaves auth off, which is fine for a laptop and not for a VM.
      QDRANT__SERVICE__API_KEY: "${SAD_QDRANT_API_KEY:-}"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The qdrant image ships neither wget nor curl - bash's own /dev/tcp
      # redirection (no external binary needed) is enough to confirm the port
      # is actually accepting connections.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles: ["core"]
    image: redis:7-alpine
    # Loopback only - Redis has no auth here either, and an open 6379 is one
    # of the most reliably exploited ports on the internet.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    profiles: ["core"]
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    # Loopback only: the browser never talks to ai-service directly. The UI's
    # nginx proxies /api/ to api-gateway, which calls ai-service over the
    # compose network. Only the ui service needs a public port.
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      SAD_DB__SERVER: "host.docker.internal"
      SAD_DB__DATABASE: "PraveenDB"
      SAD_DB__INTEGRATED_SECURITY: "false" # container has no Windows identity - see docs/setup.md
      SAD_DB__USERNAME: "${SAD_DB_USERNAME:-}"
      SAD_DB__PASSWORD: "${SAD_DB_PASSWORD:-}"
      SAD_LLM__PROVIDER: "mock"
      SAD_RETRIEVAL__BACKEND: "qdrant"
      SAD_RETRIEVAL__QDRANT_URL: "http://qdrant:6333"
      SAD_RETRIEVAL__QDRANT_API_KEY: "${SAD_QDRANT_API_KEY:-}"
      # Embeddings are unset here on purpose: ai-service/.env is excluded from
      # the image (see .dockerignore), so a real provider's key must be
      # injected at deploy time rather than baked into a layer. Left unset,
      # the service falls back to the offline hash embedder.
      SAD_RETRIEVAL__EMBEDDING_PROVIDER: "${SAD_EMBEDDING_PROVIDER:-hash}"
      SAD_RETRIEVAL__EMBEDDING_MODEL: "${SAD_EMBEDDING_MODEL:-}"
      SAD_RETRIEVAL__EMBEDDING_API_KEY: "${SAD_EMBEDDING_API_KEY:-}"
      SAD_RETRIEVAL__EMBEDDING_DIMENSIONS: "${SAD_EMBEDDING_DIMENSIONS:-384}"
      SAD_CACHE__BACKEND: "redis"
      SAD_CACHE__REDIS_URL: "redis://redis:6379/0"
      # local mode default - CHANGE SAD_AUTH__LOCAL_SIGNING_KEY (both here and on
      # api-gateway's Auth__LocalSigningKey below - they must match exactly) in any
      # shared/deployed environment. See docs/api-contracts.md § Authentication.
      SAD_AUTH__MODE: "${SAD_AUTH_MODE:-local}"
      SAD_AUTH__LOCAL_SIGNING_KEY: "${SAD_AUTH_LOCAL_SIGNING_KEY:-dev-only-insecure-signing-key-change-me}"
      SAD_AUTH__OIDC_AUTHORITY: "${SAD_AUTH_OIDC_AUTHORITY:-}"
      SAD_AUTH__OIDC_AUDIENCE: "${SAD_AUTH_OIDC_AUDIENCE:-}"
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api-gateway:
    profiles: ["core"]
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    # Loopback only - reached through the UI's nginx proxy, not directly.
    ports:
      - "127.0.0.1:5090:5090"
    environment:
      ConnectionStrings__PraveenDB: "Data Source=host.docker.internal;Initial Catalog=PraveenDB;Integrated Security=False;User ID=${SAD_DB_USERNAME:-};Password=${SAD_DB_PASSWORD:-};TrustServerCertificate=True;"
      AiService__BaseUrl: "http://ai-service:8088"
      # Must match ai-service's SAD_AUTH__* above exactly - both validate the same tokens.
      Auth__Mode: "${SAD_AUTH_MODE:-local}"
      Auth__LocalSigningKey: "${SAD_AUTH_LOCAL_SIGNING_KEY:-dev-only-insecure-signing-key-change-me}"
      Auth__OidcAuthority: "${SAD_AUTH_OIDC_AUTHORITY:-}"
      Auth__OidcAudience: "${SAD_AUTH_OIDC_AUDIENCE:-}"
    depends_on:
      - ai-service
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ui:
    profiles: ["core"]
    build:
      context: ../ui
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api-gateway

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    # Loopback only - Prometheus has no auth and its /api/v1/query endpoint
    # will answer anyone who asks.
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # No depends_on ai-service/api-gateway on purpose - this profile must work
    # standalone (--profile observability without --profile core). Prometheus
    # just retries scraping until a target exists; a target being down shows
    # up as "down" in Prometheus, which is normal, not an error.

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Anonymous viewing is convenient on a laptop and wrong anywhere else -
      # Grafana would expose your infrastructure metrics to whoever finds the
      # port. Set SAD_GRAFANA_ANONYMOUS=false and a real admin password on any
      # deployed environment.
      GF_AUTH_ANONYMOUS_ENABLED: "${SAD_GRAFANA_ANONYMOUS:-true}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: "${SAD_GRAFANA_ADMIN_PASSWORD:-admin}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  qdrant_storage:
  redis_data:
  prometheus_data:
  grafana_data:
