server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api-gateway:5090/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An investigation runs several sequential LLM calls plus retrieval and
        # scoring. nginx's 60s default fired first: the browser got a 504 while
        # the backend was still working, and the gateway then logged a 499 for a
        # client that had already been disconnected on its behalf. Nothing was
        # broken - the proxy simply gave up before the work finished.
        #
        # 300s is chosen to sit ABOVE the slowest realistic investigation while
        # still being a real ceiling: a request genuinely stuck for five minutes
        # should fail rather than hold a connection open indefinitely.
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Send the response as it arrives instead of accumulating it here, so a
        # slow reply reaches the browser rather than sitting in nginx's buffer.
        proxy_buffering off;
    }

    # =========================================================================
    # Health, and why it needs an EXACT-match location of its own
    # =========================================================================
    #
    # The SPA fallback below answers any unmatched path with index.html and a
    # 200. That is correct for client-side routes - /dashboard must return the
    # app, not a 404 - and it silently made every probe URL look healthy:
    #
    #     GET /health   -> 200, index.html
    #     GET /healthz  -> 200, index.html
    #     GET /anything -> 200, index.html
    #
    # So a monitor watching this host reported the service up regardless of
    # whether anything behind nginx was running at all. It would have kept
    # reporting up with every container stopped, because nginx alone can serve a
    # static file. That is not a weak health check, it is the absence of one
    # wearing the shape of a passing one.
    #
    # `location = /health` is an EXACT match and takes priority over the prefix
    # match below, so this genuinely reaches the gateway's health checks
    # (Program.cs: app.MapHealthChecks("/health")) and returns their verdict.
    location = /health {
        proxy_pass http://api-gateway:5090/health;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        # A health check that queues behind a slow investigation is not
        # measuring health, so it fails fast rather than waiting 300s.
        access_log off;
    }

    # Anything else probe-shaped gets an honest 404 rather than the app.
    # Enumerated deliberately: these are the paths monitoring tools try by
    # default, and each one previously answered 200 with HTML. A 404 tells a
    # monitor it is pointed at the wrong URL; a 200 tells it everything is fine.
    location = /healthz  { return 404; }
    location = /livez    { return 404; }
    location = /readyz   { return 404; }
    location = /ready    { return 404; }
    location = /status   { return 404; }
    location = /ping     { return 404; }

    # Deep readiness - database, vector store, cache, and the document count -
    # is NOT exposed here. app/api/routes_system.py::ready returns error strings
    # and internal counts, which is useful to an operator and free
    # reconnaissance to anyone else. It stays reachable inside the compose
    # network, and /api/index/status serves the same purpose from outside behind
    # authentication.

    # =========================================================================
    # Grafana, on the main site rather than a port of its own
    # =========================================================================
    #
    # The dashboards existed, were fully provisioned, and were unreachable: bound
    # to 127.0.0.1:3000 on the VM, so seeing them meant an SSH port-forward. The
    # tunnel is token-managed, so a grafana.* hostname cannot be created by a
    # deploy - but nginx already fronts this origin, so a path costs nothing.
    #
    # WEBSOCKET UPGRADE IS NOT OPTIONAL. Grafana uses a live channel for its
    # panels; without these headers the page loads and then sits there, which
    # reads as "the dashboard is broken" rather than "the proxy dropped an
    # upgrade".
    #
    # NOTE ON EXPOSURE, deliberately left as a choice rather than decided here:
    # GF_AUTH_ANONYMOUS_ENABLED defaults to true, so at this path anyone who
    # reaches the site reads the infrastructure metrics without logging in. Set
    # SAD_GRAFANA_ANONYMOUS=false in docker/.env to require a login; the admin
    # password is SAD_GRAFANA_ADMIN_PASSWORD.
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }

    # =========================================================================
    # Caching: the shell must revalidate, the assets must not
    # =========================================================================
    #
    # index.html carried NO Cache-Control at all, so browsers fell back to
    # heuristic caching and were free to serve a stale shell without asking. The
    # symptom is that a UI change ships correctly and the operator does not see
    # it: the server is serving the new bundle, the browser is still running the
    # old one, and everything looks broken in a way no server-side check finds.
    #
    # It happened repeatedly tonight and each time the deploy WAS correct. The
    # server-side evidence - new hash on disk, new hash referenced by
    # index.html, new content in the bundle - all agreed, and the screen still
    # showed the old page.
    #
    # Vite fingerprints every asset (index-DfHMuMze.js), so the two halves want
    # opposite policies:
    #
    #   index.html   no-cache. Not "no-store" - it may still be cached, but it
    #                must revalidate every time, because it is the only file
    #                whose name never changes and it is what names the others.
    #   /assets/*    immutable for a year. The content hash is IN the filename,
    #                so a changed file is a different URL and can never be stale.
    #
    # Getting this backwards is why "hard refresh" became part of deploying.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # The SPA fallback. add_header here too because add_header does not
        # inherit into a location that declares its own, and this block serves
        # index.html for every client-side route - /model-settings included,
        # which is exactly the page whose staleness was noticed.
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri /index.html;
    }
}
