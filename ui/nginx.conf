server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api-gateway:5090/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An investigation runs several sequential LLM calls plus retrieval and
        # scoring. nginx's 60s default fired first: the browser got a 504 while
        # the backend was still working, and the gateway then logged a 499 for a
        # client that had already been disconnected on its behalf. Nothing was
        # broken - the proxy simply gave up before the work finished.
        #
        # 300s is chosen to sit ABOVE the slowest realistic investigation while
        # still being a real ceiling: a request genuinely stuck for five minutes
        # should fail rather than hold a connection open indefinitely.
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Send the response as it arrives instead of accumulating it here, so a
        # slow reply reaches the browser rather than sitting in nginx's buffer.
        proxy_buffering off;
    }

    # =========================================================================
    # Health, and why it needs an EXACT-match location of its own
    # =========================================================================
    #
    # The SPA fallback below answers any unmatched path with index.html and a
    # 200. That is correct for client-side routes - /dashboard must return the
    # app, not a 404 - and it silently made every probe URL look healthy:
    #
    #     GET /health   -> 200, index.html
    #     GET /healthz  -> 200, index.html
    #     GET /anything -> 200, index.html
    #
    # So a monitor watching this host reported the service up regardless of
    # whether anything behind nginx was running at all. It would have kept
    # reporting up with every container stopped, because nginx alone can serve a
    # static file. That is not a weak health check, it is the absence of one
    # wearing the shape of a passing one.
    #
    # `location = /health` is an EXACT match and takes priority over the prefix
    # match below, so this genuinely reaches the gateway's health checks
    # (Program.cs: app.MapHealthChecks("/health")) and returns their verdict.
    location = /health {
        proxy_pass http://api-gateway:5090/health;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        # A health check that queues behind a slow investigation is not
        # measuring health, so it fails fast rather than waiting 300s.
        access_log off;
    }

    # Anything else probe-shaped gets an honest 404 rather than the app.
    # Enumerated deliberately: these are the paths monitoring tools try by
    # default, and each one previously answered 200 with HTML. A 404 tells a
    # monitor it is pointed at the wrong URL; a 200 tells it everything is fine.
    location = /healthz  { return 404; }
    location = /livez    { return 404; }
    location = /readyz   { return 404; }
    location = /ready    { return 404; }
    location = /status   { return 404; }
    location = /ping     { return 404; }

    # CORRECTION. This comment used to claim deep readiness was "NOT exposed
    # here". It was wrong, and being written down is what stopped anyone
    # rechecking it.
    #
    # `location /api/` above is a PREFIX match, so /api/ready is proxied to the
    # internet like every other /api path. The exact-match 404s below cover
    # root-level /ready and /readyz only - they never covered /api/ready. And
    # routes_system is mounted without auth (main.py:88), so the endpoint was
    # public AND unauthenticated.
    #
    # It used to return raw exception text plus the document and cache counts.
    # It no longer does: app/api/routes_system.py::ready now returns "ok" or
    # "error" per check and logs the reason. The counts live on
    # /api/index/status, behind authentication, which is where they belonged.
    #
    # Left reachable deliberately - a readiness probe that nothing can reach is
    # not a readiness probe. It is safe to expose now because it discloses a
    # verdict rather than a diagnosis.

    # =========================================================================
    # Grafana, on the main site rather than a port of its own
    # =========================================================================
    #
    # The dashboards existed, were fully provisioned, and were unreachable: bound
    # to 127.0.0.1:3000 on the VM, so seeing them meant an SSH port-forward. The
    # tunnel is token-managed, so a grafana.* hostname cannot be created by a
    # deploy - but nginx already fronts this origin, so a path costs nothing.
    #
    # WEBSOCKET UPGRADE IS NOT OPTIONAL. Grafana uses a live channel for its
    # panels; without these headers the page loads and then sits there, which
    # reads as "the dashboard is broken" rather than "the proxy dropped an
    # upgrade".
    #
    # EXPOSURE. This path is on the PUBLIC origin - anything served here is
    # served to the internet, and that is the whole point of the block.
    #
    # This comment used to say the exposure was "deliberately left as a choice
    # rather than decided here", and then described how anonymous access
    # defaulted to true. Both halves were accurate and together they shipped an
    # open dashboard: the deployed docker/.env said SAD_GRAFANA_ANONYMOUS=true
    # with the password still "admin", so every metric in the estate was
    # readable by anyone who loaded this URL.
    #
    # Documenting a hole is not closing one. A choice left to a comment is a
    # choice nobody makes. The default is now off in docker-compose.yml and
    # Grafana refuses to start without an admin password, so reaching this
    # location gets a login prompt rather than a dashboard.
    location /grafana/ {
        # RESOLVED PER REQUEST, NOT AT STARTUP - and this is not a preference.
        #
        # With a literal upstream, nginx resolves the name when it loads its
        # config and REFUSES TO START if it cannot: "host not found in upstream".
        # Grafana crashed on a provisioning error, nginx could not resolve it, and
        # the entire site went down - every screen, for every user, because an
        # optional dashboard was unhealthy. A metrics page must not be able to
        # take the product with it.
        #
        # Naming the upstream in a variable defers resolution to request time, so
        # nginx starts regardless and a missing Grafana costs a 502 on /grafana/
        # alone. 127.0.0.11 is Docker's embedded DNS; the short TTL means a
        # recreated container is picked up rather than cached forever.
        #
        # THE PREFIX IS PASSED THROUGH, NOT STRIPPED, and that is the opposite of
        # the usual sub-path proxy. GF_SERVER_SERVE_FROM_SUB_PATH=true means
        # Grafana serves ITSELF at /grafana/ and expects to receive that prefix:
        #
        #     grafana:3000/           -> 301 to /grafana/
        #     grafana:3000/grafana/   -> 200
        #
        # A rewrite stripping the prefix therefore produced an endless 301: nginx
        # handed Grafana "/", Grafana redirected to "/grafana/", nginx stripped it
        # again. Every path 301'd to itself and the browser gave up.
        #
        # Naming the upstream in a variable leaves the request URI untouched,
        # which is exactly what is wanted here - so the variable is doing two jobs
        # at once, deferring DNS and preserving the path.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # https LITERALLY, not $scheme - and this one is a redirect loop, not a
        # cosmetic detail.
        #
        # TLS terminates at Cloudflare and the tunnel reaches nginx over plain
        # http, so $scheme here is "http" no matter how the browser arrived.
        # Grafana compares that against its root_url (https://.../grafana/),
        # decides the request is on the wrong scheme, and 301s to the https form
        # of the same path. The browser requests https, the tunnel forwards it as
        # http, and Grafana redirects again - forever. Every path 301'd to
        # itself.
        #
        # The app's own /api/ block above can keep $scheme because nothing behind
        # it compares the scheme to a configured public URL.
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }

    # =========================================================================
    # Caching: the shell must revalidate, the assets must not
    # =========================================================================
    #
    # index.html carried NO Cache-Control at all, so browsers fell back to
    # heuristic caching and were free to serve a stale shell without asking. The
    # symptom is that a UI change ships correctly and the operator does not see
    # it: the server is serving the new bundle, the browser is still running the
    # old one, and everything looks broken in a way no server-side check finds.
    #
    # It happened repeatedly tonight and each time the deploy WAS correct. The
    # server-side evidence - new hash on disk, new hash referenced by
    # index.html, new content in the bundle - all agreed, and the screen still
    # showed the old page.
    #
    # Vite fingerprints every asset (index-DfHMuMze.js), so the two halves want
    # opposite policies:
    #
    #   index.html   no-cache. Not "no-store" - it may still be cached, but it
    #                must revalidate every time, because it is the only file
    #                whose name never changes and it is what names the others.
    #   /assets/*    immutable for a year. The content hash is IN the filename,
    #                so a changed file is a different URL and can never be stale.
    #
    # Getting this backwards is why "hard refresh" became part of deploying.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # The SPA fallback. add_header here too because add_header does not
        # inherit into a location that declares its own, and this block serves
        # index.html for every client-side route - /model-settings included,
        # which is exactly the page whose staleness was noticed.
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri /index.html;
    }
}
